    <link rel="stylesheet" href="css/bootstrap.min.css" />

  <body>
    <header>
      <nav class="navbar navbar-expand navbar-light">
        <div class="container-fluid">
          <a class="navbar-logo link-plus h3" href="/">MR</a>
          <ul class="navbar-nav">
            <li class="nav-item">
              <p class="link">
                <a class="link-plus" href="/">Projects</a>
              </p>
            </li>
            <li class="nav-item">
              <p class="link">
                <a class="link-plus active" href="/art.html" aria-current="page">Art</a>
              </p>
            </li>
            <li class="nav-item">
              <p class="link">
                <a class="link-plus" href="/about.html">About</a>
              </p>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="container">
      <div class="row flex-column">
        <div class="page-header">
          <h1 class="page-title">Art</h1>
          <h2 class="page-subtitle">
            Selected paintings, drawings, sculpture and experimental work.
          </h2>
        </div>

        <div class="page-content">
          <div class="art-gallery" id="art-gallery">
            <!--
              Add artwork here. Drop image files in images/art/ (see
              images/art/README.md), then copy this block for each piece:

              <figure class="art-item">
                <a
                  class="art-link"
                  href="images/art/example.jpg"
                  data-title="Untitled"
                  data-meta="Oil on canvas, 60 &times; 80cm, 2024"
                >
                  <img
                    src="images/art/example.jpg"
                    alt="Describe the artwork for screen readers"
                    loading="lazy"
                  />
                </a>
                <figcaption>
                  <p class="art-title">Untitled</p>
                  <p class="art-meta">Oil on canvas, 60 &times; 80cm, 2024</p>
                </figcaption>
              </figure>

              Remove the empty-state paragraph below once at least one
              piece is added.
            -->
          </div>
          <p class="art-empty-state" id="art-empty-state">
            Artwork is on its way&mdash;this gallery is wired up and ready
            for images.
          </p>
        </div>
      </div>
    </main>
    <!-- content container -->

    <dialog class="art-viewer" id="art-viewer" aria-label="Artwork viewer">
      <button type="button" class="art-viewer-close" aria-label="Close">
        &times;
      </button>
      <img src="" alt="" />
      <figcaption>
        <p class="art-viewer-title"></p>
        <p class="art-viewer-meta"></p>
      </figcaption>
    </dialog>

    <script src="js/art-gallery.js"></script>
  </body>
</html>
